name: Render story reel (test branch)

# Test-only: runs on pushes to story-reel-test, reads story-test-payload.json, commits the mp4 to out-test/
# on the same branch. Does not touch main, docs/ or any callback.
on:
  push:
    branches: [story-reel-test]
    paths: [story-test-payload.json, src/**, scripts/prepare-story.mjs, .github/workflows/render-story-test.yml]

permissions:
  contents: write

concurrency:
  group: render-story-test
  cancel-in-progress: true

jobs:
  render:
    if: "!contains(github.event.head_commit.message, '[render]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy
          pip install -q "earshot @ git+https://github.com/Leonxlnx/earshot@7a7f7c5c70d4a763a1eca4b3666af7c77e313f97" || echo "earshot install failed"
      - name: Prepare
        run: WD="$(cat story-test-payload.json)" node scripts/prepare-story.mjs
      - name: Music bed
        run: python3 scripts/make_bed.py public/bed.wav "$FRAMES" "$CUTS"
      - name: Render
        run: npx remotion render src/index.ts StoryReel out/raw.mp4 --props=props.json --codec=h264 --crf=23
      - name: Sound effects (optional)
        continue-on-error: true
        run: python3 scripts/add_sfx.py out/raw.mp4 out/sfx.mov "$CUTS" castlist
      - name: Loudness + commit
        run: |
          mkdir -p out-test
          SRC=out/raw.mp4; [ -s out/sfx.mov ] && SRC=out/sfx.mov
          ffmpeg -loglevel error -y -i "$SRC" -c:v copy -af loudnorm=I=-14:TP=-1.5:LRA=11 -c:a aac -b:a 192k -movflags +faststart "out-test/$FILE"
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add "out-test/$FILE" && git commit -m "[render] $FILE" && git push
