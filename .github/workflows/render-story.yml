name: Render story reel

# Live: Make poller 4982957 sends repository_dispatch "render-story" when a story reel's clips are ready.
# Renders StoryReel, publishes docs/renders/story/<key>.mp4 on Pages, then posts a Placid-style
# "finished" webhook to the callback (Publish Placid Reel 4916205), so publishing is unchanged.
on:
  repository_dispatch:
    types: [render-story]
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload (same shape as client_payload)"
        required: true

permissions:
  contents: write

concurrency:
  group: render-story
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PAGES_BASE: https://creatorscripts.github.io/trilaunchpad-brief-explainer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy
          pip install -q "earshot @ git+https://github.com/Leonxlnx/earshot@7a7f7c5c70d4a763a1eca4b3666af7c77e313f97" || echo "earshot install failed; renders without sound effects"

      - name: Prepare payload and assets
        env:
          CP: ${{ toJSON(github.event.client_payload) }}
          WD: ${{ github.event.inputs.payload }}
        run: node scripts/prepare-story.mjs

      - name: Music bed
        run: python3 scripts/make_bed.py public/bed.wav "$FRAMES" "$CUTS"

      - name: Render
        run: npx remotion render src/index.ts StoryReel out/raw.mp4 --props=props.json --codec=h264 --crf=23 --concurrency=4

      - name: Sound effects (earshot; optional)
        continue-on-error: true
        run: python3 scripts/add_sfx.py out/raw.mp4 out/sfx.mov "$CUTS" castlist

      - name: Loudness and publish file
        run: |
          mkdir -p docs/renders/story
          SRC=out/raw.mp4; [ -s out/sfx.mov ] && SRC=out/sfx.mov
          ffmpeg -loglevel error -y -i "$SRC" -c:v copy -af loudnorm=I=-14:TP=-1.5:LRA=11 -c:a aac -b:a 192k -movflags +faststart "docs/renders/story/$FILE"
          git config user.name "brief-explainer-bot"
          git config user.email "brief-explainer-bot@users.noreply.github.com"
          git add "docs/renders/story/$FILE"
          git commit -m "story render: $RUN_KEY"
          git pull --rebase -q && git push -q

      - name: Wait for GitHub Pages
        run: |
          URL="$PAGES_BASE/renders/story/$FILE"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
            [ "$code" = "200" ] && echo "live: $URL" && break
            sleep 10
          done
          echo "VIDEO_URL=$URL" >> "$GITHUB_ENV"
          [ "$code" = "200" ]

      - name: Hand off to publishing (Placid-style webhook)
        if: success() && env.CALLBACK != ''
        run: |
          curl -sS -X POST "$CALLBACK" -H 'Content-Type: application/json' \
            -d "{\"status\":\"finished\",\"type\":\"video\",\"video_url\":\"$VIDEO_URL\",\"passthrough\":\"$PASSTHROUGH\",\"renderer\":\"remotion-story\"}"
